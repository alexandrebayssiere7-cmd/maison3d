[package]
name = "maison3d"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.16", features = ["serialize"] }
bevy_egui = "0.34"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# bevy est inutilisable en debug sans optimiser les dépendances
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
