name: CI

# push sur main seulement : les branches sont déjà vérifiées par leur PR
on:
  push:
    branches: [main]
  pull_request:

# un nouveau push annule le run précédent de la même ref, devenu obsolète
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# moindre privilège : le jeton GITHUB_TOKEN ne fait que lire le dépôt
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # échec rapide : le format se vérifie sans compiler, donc sans apt ni cache
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain Rust
        run: rustup toolchain install

      - name: Format
        run: cargo fmt --check

  # failles connues (base RustSec) dans Cargo.lock ; crates abandonnées tirées par Bevy en simple avertissement
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny

      - name: Audit des dépendances
        run: cargo deny --locked --config .github/deny.toml check advisories -W unmaintained

  # le projet se développe sur Mac : on vérifie qu'il y compile encore (Metal, pas d'apt)
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain Rust
        run: rustup toolchain install

      # seul main enregistre le cache : les caches de PR (1,2 Go chacun) saturaient les 10 Go du dépôt et évinçaient celui de main
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build
        run: cargo build --locked

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bevy instrumenté pour la couverture remplit le disque du runner : on retire les SDK inutiles
      - name: Libère de la place disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Dépendances système Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # version et composants lus dans rust-toolchain.toml : une seule source de vérité
      - name: Toolchain Rust
        run: rustup toolchain install

      # seul main enregistre le cache : les caches de PR (1,2 Go chacun) saturaient les 10 Go du dépôt et évinçaient celui de main
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-llvm-cov

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # --locked : Cargo.lock doit être à jour, la CI ne le réécrit pas en silence
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # cargo llvm-cov lance les tests : pas de cargo test séparé, qui recompilerait tout
      - name: Tests et couverture
        run: |
          mkdir -p target/coverage/rust
          cargo llvm-cov --locked --lcov --output-path target/coverage/rust/lcov.info
          cargo llvm-cov report --summary-only

      - name: Score CRAP (échec au-delà de 30)
        run: |
          pip install git+https://github.com/unclebob/crapper@6fd92c4c9bcc56efb64a2f8743d5a2993bcfd42d
          # fichiers passés explicitement : crapper ignore les chemins contenant un dossier test
          crapper --use-existing-coverage --threshold 30 $(find src -name '*.rs')
