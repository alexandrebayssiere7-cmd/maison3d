name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Bevy instrumenté pour la couverture remplit le disque du runner : on retire les SDK inutiles
      - name: Libère de la place disque
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Dépendances système Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      # version et composants lus dans rust-toolchain.toml : une seule source de vérité
      - name: Toolchain Rust
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@cargo-llvm-cov

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # cargo llvm-cov lance les tests : pas de cargo test séparé, qui recompilerait tout
      - name: Tests et couverture
        run: |
          mkdir -p target/coverage/rust
          cargo llvm-cov --lcov --output-path target/coverage/rust/lcov.info
          cargo llvm-cov report --summary-only

      - name: Score CRAP (échec au-delà de 30)
        run: |
          pip install git+https://github.com/unclebob/crapper
          # fichiers passés explicitement : crapper ignore les chemins contenant un dossier test
          crapper --use-existing-coverage --threshold 30 $(find src -name '*.rs')
